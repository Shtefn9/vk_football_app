<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Присоединиться к команде</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container form-container">
        <h1>👥 Присоединиться к команде</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <!-- uid передаём скрытым полем -->
            <input type="hidden" name="uid" value="{{ uid }}">
            <div class="form-group">
                <label>Код команды (6 символов) *</label>
                <input type="text" name="join_code" required placeholder="ABC123"
                       maxlength="6" style="text-transform:uppercase;">
            </div>
            <button type="submit" class="btn-submit btn-secondary">Присоединиться</button>
        </form>
        <a href="/start?uid={{ uid }}" class="back-link">← Назад</a>
    </div>
</body>
</html>
