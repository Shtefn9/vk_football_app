<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать команду</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container form-container">
        <h1>🎯 Создание команды</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <!-- uid передаём скрытым полем чтобы сервер знал кто мы -->
            <input type="hidden" name="uid" value="{{ uid }}">
            <div class="form-group">
                <label>Название команды *</label>
                <input type="text" name="team_name" required placeholder="Например: FC Spartak">
            </div>
            <div class="form-group">
                <label>Город</label>
                <input type="text" name="city" placeholder="Например: Москва">
            </div>
            <button type="submit" class="btn-submit">Создать команду</button>
        </form>
        <a href="/start?uid={{ uid }}" class="back-link">← Назад</a>
    </div>
</body>
</html>
