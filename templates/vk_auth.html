<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Футбольная Команда</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="text-align:center; padding:40px 20px;">

        <!-- Экран 1: Загрузка -->
        <div id="loading">
            <h1>⚽ Загрузка...</h1>
            <p style="color:#666; margin-top:10px;">Подключение к ВКонтакте</p>
        </div>

        <!-- Экран 2: Ручной вход -->
        <div id="manual-login" style="display:none;">
            <h1>⚽ Моя Команда</h1>
            <p style="color:#666; margin:15px 0;">Тестовый режим входа</p>
            <form method="POST" action="/test-login">
                <div class="form-group">
                    <input type="text" name="first_name" required placeholder="Имя" value="Степан"
                           style="width:100%;padding:12px;margin:8px 0;border:2px solid #e5ebf1;border-radius:10px;font-size:16px;">
                </div>
                <div class="form-group">
                    <input type="text" name="last_name" required placeholder="Фамилия" value="Волгин"
                           style="width:100%;padding:12px;margin:8px 0;border:2px solid #e5ebf1;border-radius:10px;font-size:16px;">
                </div>
                <div class="form-group">
                    <input type="number" name="vk_id" required placeholder="VK ID" value="295679412"
                           style="width:100%;padding:12px;margin:8px 0;border:2px solid #e5ebf1;border-radius:10px;font-size:16px;">
                </div>
                <button type="submit" class="btn-submit" style="width:100%;margin-top:10px;">Войти</button>
            </form>
            <p style="margin-top:15px;font-size:12px;color:#999;">После модерации вход будет автоматически через VK.</p>
        </div>

        <!-- Экран 3: Успех -->
        <div id="success" style="display:none;">
            <div style="font-size:64px;margin-bottom:20px;">✅</div>
            <h1>Привет, <span id="user-name"></span>!</h1>
            <p style="color:#666;margin:15px 0;">Авторизация прошла успешно</p>
            <a id="continue-btn" href="/start" class="btn-submit"
               style="display:block;text-decoration:none;margin-top:20px;">
                Продолжить →
            </a>
        </div>

    </div>

    <script>
        console.log('[Auth] Script loaded');

        var timeoutId = setTimeout(function() {
            console.log('[Auth] Timeout — ручной вход');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('manual-login').style.display = 'block';
        }, 5000);

        function showManualLogin() {
            clearTimeout(timeoutId);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('manual-login').style.display = 'block';
        }

        if (typeof vkBridge === 'undefined') {
            console.log('[Auth] vkBridge не найден');
            showManualLogin();
        } else {
            vkBridge.send('VKWebAppInit')
                .then(function() {
                    return vkBridge.send('VKWebAppGetUserInfo');
                })
                .then(function(data) {
                    console.log('[Auth] UserInfo OK:', data.first_name, data.last_name);
                    return fetch('/vk-auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            vk_id: data.id,
                            first_name: data.first_name,
                            last_name: data.last_name || '',
                            photo: data.photo_200 || ''
                        })
                    });
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(serverData) {
                    console.log('[Auth] Сервер OK. user_id=' + serverData.user_id);
                    clearTimeout(timeoutId);

                    // Передаём uid в URL — обходим проблему с куки во фрейме VK
                    document.getElementById('continue-btn').href = '/start?uid=' + serverData.user_id;
                    document.getElementById('user-name').textContent =
                        serverData.first_name + ' ' + serverData.last_name;

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                })
                .catch(function(error) {
                    console.error('[Auth] Ошибка:', error);
                    showManualLogin();
                });
        }
    </script>
</body>
</html>
