<div class="container form-container">
    <h1>🎯 Создание команды</h1>
    <div id="error-msg" class="error-message" style="display:none;"></div>

    <div class="form-group">
        <label>Название команды *</label>
        <input type="text" id="team_name" maxlength="30" required placeholder="Например: FC Spartak">
    </div>
    <div class="form-group">
        <label>Город</label>
        <input type="text" id="city" maxlength="30" placeholder="Например: Москва">
    </div>
    <button id="submit-btn" class="btn-submit">Далее →</button>
    <a id="back-btn" class="back-link">← Назад</a>
</div>

<script>
(function() {
    console.log('[CreateTeam] Fragment loaded');

    document.getElementById('back-btn').onclick = function() {
        Router.navigate('/select-team');
    };

    document.getElementById('submit-btn').onclick = async function() {
        var teamName = document.getElementById('team_name').value.trim();
        var city = document.getElementById('city').value.trim();
        var errEl = document.getElementById('error-msg');

        // Название команды: буквы, цифры, пробел, дефис, точка, апостроф
        var validNamePattern = /^[a-zA-Zа-яА-ЯёЁ0-9\s\-.']+$/;
        // Город: только буквы, пробел и дефис
        var validCityPattern = /^[a-zA-Zа-яА-ЯёЁ\s\-]+$/;

        if (!teamName || teamName.length < 2) {
            errEl.textContent = 'Название команды должно содержать минимум 2 символа';
            errEl.style.display = 'block';
            return;
        }
        if (teamName.length > 30) {
            errEl.textContent = 'Название слишком длинное (максимум 30 символов)';
            errEl.style.display = 'block';
            return;
        }
        if (!validNamePattern.test(teamName)) {
            errEl.textContent = 'Название может содержать только буквы, цифры, пробел, дефис, точку';
            errEl.style.display = 'block';
            return;
        }
        if (city && city.length < 2) {
            errEl.textContent = 'Название города должно содержать минимум 2 символа';
            errEl.style.display = 'block';
            return;
        }
        if (city.length > 30) {
            errEl.textContent = 'Название города слишком длинное (максимум 30 символов)';
            errEl.style.display = 'block';
            return;
        }
        if (city && !validCityPattern.test(city)) {
            errEl.textContent = 'Город может содержать только буквы, пробел и дефис (например: Москва)';
            errEl.style.display = 'block';
            return;
        }

        document.getElementById('submit-btn').textContent = 'Создаём...';
        document.getElementById('submit-btn').disabled = true;

        var result = await API.createTeam({ team_name: teamName, city: city, stats_level: 'basic' });
        if (result.success) {
            Router.navigate('/select-stats');
        } else {
            errEl.textContent = 'Ошибка: ' + (result.error || 'неизвестная ошибка');
            errEl.style.display = 'block';
            document.getElementById('submit-btn').textContent = 'Далее →';
            document.getElementById('submit-btn').disabled = false;
        }
    };
})();
</script>
