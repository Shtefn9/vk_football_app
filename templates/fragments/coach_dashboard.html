<style>
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
.menu-btn { background:none; border:none; font-size:24px; cursor:pointer; color:#667eea; padding:5px 10px; border-radius:8px; }
.menu-btn:hover { background:#f0f4ff; }
.dropdown-menu { display:none; position:absolute; right:25px; top:60px; background:white; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.15); z-index:100; min-width:200px; overflow:hidden; }
.dropdown-menu.open { display:block; }
.dropdown-item { display:block; width:100%; padding:14px 18px; background:none; border:none; text-align:left; cursor:pointer; font-size:15px; color:#333; border-bottom:1px solid #f0f0f0; }
.dropdown-item:last-child { border-bottom:none; }
.dropdown-item:hover { background:#f8f9ff; }
.dropdown-item.danger { color:#c62828; }
.dropdown-item.upgrade { color:#667eea; font-weight:600; }
.event-clickable { cursor:pointer; transition:box-shadow 0.2s, border-color 0.2s; }
.event-clickable:hover { border-color:#667eea; box-shadow:0 2px 10px rgba(102,126,234,0.15); }
.event-arrow { float:right; color:#667eea; font-size:18px; margin-top:2px; }
.player-row { display:flex; justify-content:space-between; align-items:center; padding:12px 15px; border:1px solid #e5ebf1; border-radius:10px; margin-bottom:8px; }
.position-select { border:1px solid #e5ebf1; border-radius:8px; padding:6px 10px; font-size:13px; color:#333; background:white; cursor:pointer; }
.position-select:focus { border-color:#667eea; outline:none; }
.trial-banner { background:linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius:12px; padding:12px 15px; margin-bottom:15px; display:flex; align-items:center; gap:10px; }
.trial-banner-text { font-size:13px; color:#2e7d32; font-weight:600; }
</style>

<div class="container" style="position:relative;">
    <div class="top-bar">
        <h1 style="margin:0;">🎯 Тренерский кабинет</h1>
        <button class="menu-btn" id="menu-btn">⋮</button>
    </div>

    <div class="dropdown-menu" id="dropdown-menu">
        <button class="dropdown-item upgrade" id="upgrade-item" style="display:none;">💎 Управление тарифом</button>
        <button class="dropdown-item" id="rules-item">📋 Правила сервиса</button>
        <button class="dropdown-item" id="switch-team-item">🔄 Сменить команду</button>
        <button class="dropdown-item danger" id="quit-team-item">🚪 Покинуть команду</button>
    </div>

    <div class="user-header">
        <div class="user-name" id="user-name"></div>
        <div class="user-role">🎯 Тренер</div>
    </div>

    <div id="trial-banner" style="display:none;" class="trial-banner">
        <span style="font-size:20px;">🎁</span>
        <div class="trial-banner-text" id="trial-text"></div>
    </div>

    <div class="team-info" id="team-info"></div>

    <div class="section">
        <h2>📅 Календарь</h2>
        <button class="add-event-btn" id="toggle-form-btn">➕ Добавить событие</button>
        <div id="add-event-form" style="display:none; background:#f8f9ff; border-radius:12px; padding:15px; margin-bottom:15px;">
            <div class="form-group"><input type="text" id="ev-title" placeholder="Название события" required></div>
            <div class="form-group"><input type="datetime-local" id="ev-date" required></div>
            <div class="form-group">
                <select id="ev-type">
                    <option value="training">Тренировка</option>
                    <option value="match">Матч</option>
                </select>
            </div>
            <div class="form-group"><input type="text" id="ev-location" placeholder="Место проведения"></div>
            <button id="save-event-btn" class="btn-submit">Добавить</button>
        </div>
        <div id="events-list"></div>
    </div>

    <div class="section">
        <h2>👥 Состав команды</h2>
        <p style="font-size:13px;color:#999;margin-bottom:10px;">Назначьте позицию каждому игроку</p>
        <div id="players-list"></div>
    </div>
</div>

<script>
(function() {
    var data = Router.currentData || {};
    var statsLevel = (data.team && data.team.stats_level) || 'basic';
    var trialActive = data.team && data.team.trial_active;
    var trialUntil = data.team && data.team.trial_until;

    if (data.user) document.getElementById('user-name').textContent = data.user.first_name + ' ' + data.user.last_name;

    // Баннер пробного периода
    if (trialActive && trialUntil) {
        document.getElementById('trial-banner').style.display = 'flex';
        document.getElementById('trial-text').textContent = 'Пробный период активен до ' + trialUntil;
    }

    if (data.team) {
        document.getElementById('team-info').innerHTML =
            '<div class="team-name">' + data.team.name + '</div>' +
            (data.team.city ? '<div style="color:#666;font-size:14px;">📍 ' + data.team.city + '</div>' : '') +
            '<div class="join-code">Код: <strong>' + data.team.join_code + '</strong></div>' +
            '<div style="font-size:12px;color:#888;margin-top:4px;">Тариф: ' +
            (statsLevel === 'detailed' ? '💎 Детальный' : '⚽ Базовый') + '</div>';
    }

    // Кнопка управления тарифом — всегда показываем
    document.getElementById('upgrade-item').style.display = 'block';

    // События
    var eventsList = document.getElementById('events-list');
    if (data.events && data.events.length > 0) {
        eventsList.innerHTML = data.events.map(function(e) {
            return '<div class="event event-clickable" data-event-id="' + e.id + '" data-event-title="' + e.title + '" data-event-type="' + e.event_type + '">' +
                '<span class="event-arrow">›</span>' +
                '<div class="event-title">' + (e.event_type === 'match' ? '⚽' : '🏃') + ' ' + e.title + '</div>' +
                '<div class="event-date">' + e.event_date + '</div>' +
                (e.location ? '<div class="event-location">📍 ' + e.location + '</div>' : '') +
                '</div>';
        }).join('');
        document.querySelectorAll('.event-clickable').forEach(function(el) {
            el.onclick = function() {
                Router.navigate('/event-detail', {
                    event_id: parseInt(this.getAttribute('data-event-id')),
                    event_title: this.getAttribute('data-event-title'),
                    event_type: this.getAttribute('data-event-type')
                });
            };
        });
    } else {
        eventsList.innerHTML = '<p class="empty-state">Пока нет событий.</p>';
    }

    // Состав с выбором позиции
    var playersList = document.getElementById('players-list');
    if (data.players && data.players.length > 0) {
        playersList.innerHTML = data.players.map(function(p) {
            return '<div class="player-row">' +
                '<div style="font-weight:600;color:#333;">' + p.first_name + ' ' + p.last_name + '</div>' +
                '<select class="position-select" data-player-id="' + p.id + '">' +
                '<option value="forward" ' + (p.position === 'forward' ? 'selected' : '') + '>⚡ Нападающий</option>' +
                '<option value="defender" ' + (p.position === 'defender' ? 'selected' : '') + '>🛡 Защитник</option>' +
                '<option value="goalkeeper" ' + (p.position === 'goalkeeper' ? 'selected' : '') + '>🧤 Вратарь</option>' +
                '</select>' +
                '</div>';
        }).join('');
        document.querySelectorAll('.position-select').forEach(function(sel) {
            sel.onchange = async function() {
                var playerId = parseInt(this.getAttribute('data-player-id'));
                var position = this.value;
                await API.setPosition(playerId, position);
            };
        });
    } else {
        playersList.innerHTML = '<p class="empty-state">Игроки ещё не вступили в команду.</p>';
    }

    // Меню
    var menuBtn = document.getElementById('menu-btn');
    var dropdownMenu = document.getElementById('dropdown-menu');
    menuBtn.onclick = function(e) { e.stopPropagation(); dropdownMenu.classList.toggle('open'); };
    document.addEventListener('click', function() { dropdownMenu.classList.remove('open'); });
    document.getElementById('upgrade-item').onclick = function() {
        Router.navigate('/select-stats', { is_upgrade: true, current_stats_level: statsLevel });
    };
    document.getElementById('rules-item').onclick = function() {
        Router.navigate('/rules', { back_route: '/dashboard' });
    };
    document.getElementById('switch-team-item').onclick = async function() {
        await API.leaveTeam(); Router.navigate('/select-team');
    };
    document.getElementById('quit-team-item').onclick = async function() {
        if (!confirm('Покинуть команду?')) return;
        var r = await API.quitTeam();
        if (r.success) Router.navigate('/select-team');
        else alert('Ошибка: ' + r.error);
    };

    document.getElementById('toggle-form-btn').onclick = function() {
        var f = document.getElementById('add-event-form');
        f.style.display = f.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('save-event-btn').onclick = async function() {
        var title = document.getElementById('ev-title').value.trim();
        var date = document.getElementById('ev-date').value;
        var type = document.getElementById('ev-type').value;
        var location = document.getElementById('ev-location').value.trim();
        if (!title || !date) { alert('Заполните название и дату'); return; }
        this.textContent = 'Сохраняем...';
        var r = await API.addEvent({ title: title, event_date: date, event_type: type, location: location });
        if (r.success) Router.navigate('/dashboard');
        else { alert('Ошибка: ' + r.error); this.textContent = 'Добавить'; }
    };
})();
</script>
