<style>
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}
.menu-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #667eea;
    padding: 5px 10px;
    border-radius: 8px;
}
.menu-btn:hover { background: #f0f4ff; }
.dropdown-menu {
    display: none;
    position: absolute;
    right: 25px;
    top: 60px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100;
    min-width: 200px;
    overflow: hidden;
}
.dropdown-menu.open { display: block; }
.dropdown-item {
    display: block;
    width: 100%;
    padding: 14px 18px;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    color: #333;
    border-bottom: 1px solid #f0f0f0;
}
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: #f8f9ff; }
.dropdown-item.danger { color: #c62828; }
</style>

<div class="container" style="position:relative;">

    <div class="top-bar">
        <h1 style="margin:0;">👤 Мой профиль</h1>
        <button class="menu-btn" id="menu-btn">⋮</button>
    </div>

    <!-- Выпадающее меню -->
    <div class="dropdown-menu" id="dropdown-menu">
        <button class="dropdown-item" id="switch-team-item">🔄 Сменить команду</button>
        <button class="dropdown-item danger" id="quit-team-item">🚪 Покинуть команду</button>
    </div>

    <div class="user-header">
        <div class="user-name" id="user-name"></div>
        <div class="user-role">👤 Игрок</div>
    </div>

    <div class="team-info" id="team-info"></div>

    <div class="nav">
        <button onclick="showTab('calendar')" id="btn-calendar" class="active">📅 Календарь</button>
        <button onclick="showTab('stats')" id="btn-stats">📊 Статистика</button>
        <button onclick="showTab('advice')" id="btn-advice">💡 Советы</button>
    </div>

    <div id="calendar" class="tab">
        <h2>📅 Расписание</h2>
        <div id="events-list"></div>
    </div>

    <div id="stats" class="tab" style="display:none;">
        <h2>📊 Твоя статистика</h2>
        <div class="stats-grid" id="stats-grid"></div>
    </div>

    <div id="advice" class="tab" style="display:none;">
        <h2>💡 Рекомендации</h2>
        <div id="advice-content"></div>
    </div>

</div>

<script>
function showTab(name) {
    document.querySelectorAll('.tab').forEach(function(t) { t.style.display = 'none'; });
    document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById(name).style.display = 'block';
    document.getElementById('btn-' + name).classList.add('active');
}

(function() {
    console.log('[PlayerDashboard] Fragment loaded');
    var data = Router.currentData || {};

    if (data.user) {
        document.getElementById('user-name').textContent = data.user.first_name + ' ' + data.user.last_name;
    }
    if (data.team) {
        document.getElementById('team-info').innerHTML = '<div class="team-name">' + data.team.name + '</div>';
    } else {
        document.getElementById('team-info').innerHTML = '<p style="color:#666;">Вы не состоите в команде</p>';
    }

    var eventsList = document.getElementById('events-list');
    if (data.events && data.events.length > 0) {
        eventsList.innerHTML = data.events.map(function(e) {
            return '<div class="event">' +
                '<div class="event-title">' + (e.event_type === 'match' ? '⚽' : '🏃') + ' ' + e.title + '</div>' +
                '<div class="event-date">' + e.event_date + '</div>' +
                (e.location ? '<div class="event-location">📍 ' + e.location + '</div>' : '') +
                '</div>';
        }).join('');
    } else {
        eventsList.innerHTML = '<p class="empty-state">Пока нет запланированных событий</p>';
    }

    var stats = data.stats || { games: 0, goals: 0, assists: 0, pass_accuracy: 0 };
    document.getElementById('stats-grid').innerHTML =
        '<div class="stat-card"><div class="stat-value">' + stats.games + '</div><div class="stat-label">Игр</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + stats.goals + '</div><div class="stat-label">Голов</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + stats.assists + '</div><div class="stat-label">Передач</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + stats.pass_accuracy + '%</div><div class="stat-label">Точность</div></div>';

    var adviceEl = document.getElementById('advice-content');
    if (stats.games === 0) {
        adviceEl.innerHTML = '<div class="advice"><div class="advice-title">📊 Статистика пуста</div>' +
            '<div class="advice-text">Попроси тренера внести твои результаты после матча!</div></div>';
    } else {
        adviceEl.innerHTML = '<div class="advice"><div class="advice-title">📈 Продолжай в том же духе!</div>' +
            '<div class="advice-text">За ' + stats.games + ' игр: ' + stats.goals + ' голов, ' + stats.assists + ' передач. Точность паса: ' + stats.pass_accuracy + '%.</div></div>';
    }

    // Меню ⋮
    var menuBtn = document.getElementById('menu-btn');
    var dropdownMenu = document.getElementById('dropdown-menu');

    menuBtn.onclick = function(e) {
        e.stopPropagation();
        dropdownMenu.classList.toggle('open');
    };
    document.addEventListener('click', function() {
        dropdownMenu.classList.remove('open');
    });

    document.getElementById('switch-team-item').onclick = async function() {
        await API.leaveTeam();
        Router.navigate('/select-team');
    };

    document.getElementById('quit-team-item').onclick = async function() {
        if (!confirm('Вы уверены, что хотите покинуть команду?')) return;
        var result = await API.quitTeam();
        if (result.success) {
            Router.navigate('/select-team');
        } else {
            alert('Ошибка: ' + (result.error || 'неизвестная ошибка'));
        }
    };
})();
</script>
