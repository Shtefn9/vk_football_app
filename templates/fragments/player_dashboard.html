<style>
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
.menu-btn { background:none; border:none; font-size:24px; cursor:pointer; color:#667eea; padding:5px 10px; border-radius:8px; }
.menu-btn:hover { background:#f0f4ff; }
.dropdown-menu { display:none; position:absolute; right:25px; top:60px; background:white; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.15); z-index:100; min-width:200px; overflow:hidden; }
.dropdown-menu.open { display:block; }
.dropdown-item { display:block; width:100%; padding:14px 18px; background:none; border:none; text-align:left; cursor:pointer; font-size:15px; color:#333; border-bottom:1px solid #f0f0f0; }
.dropdown-item:last-child { border-bottom:none; }
.dropdown-item:hover { background:#f8f9ff; }
.dropdown-item.danger { color:#c62828; }
.event-clickable { cursor:pointer; transition:border-color 0.2s, box-shadow 0.2s; }
.event-clickable:hover { border-color:#667eea; box-shadow:0 2px 10px rgba(102,126,234,0.15); }
.event-arrow { float:right; color:#667eea; font-size:18px; margin-top:2px; }
</style>

<div class="container" style="position:relative;">
    <div class="top-bar">
        <h1 style="margin:0;">👤 Мой профиль</h1>
        <button class="menu-btn" id="menu-btn">⋮</button>
    </div>

    <div class="dropdown-menu" id="dropdown-menu">
        <button class="dropdown-item" id="rules-item">📋 Правила сервиса</button>
        <button class="dropdown-item" id="switch-team-item">🔄 Сменить команду</button>
        <button class="dropdown-item danger" id="quit-team-item">🚪 Покинуть команду</button>
    </div>

    <div class="user-header">
        <div class="user-name" id="user-name"></div>
        <div class="user-role">👤 Игрок</div>
    </div>

    <div class="team-info" id="team-info"></div>

    <div class="nav">
        <button onclick="showTab('calendar')" id="btn-calendar" class="active">📅 Календарь</button>
        <button onclick="showTab('stats')" id="btn-stats">📊 Статистика</button>
        <button onclick="showTab('advice')" id="btn-advice">💡 Советы</button>
    </div>

    <div id="calendar" class="tab">
        <h2>📅 Расписание</h2>
        <div id="events-list"></div>
    </div>

    <div id="stats" class="tab" style="display:none;">
        <h2>📊 Твоя статистика</h2>
        <div class="stats-grid" id="stats-grid"></div>
    </div>

    <div id="advice" class="tab" style="display:none;">
        <h2>💡 Рекомендации</h2>
        <div id="advice-content"></div>
    </div>
</div>

<script>
function showTab(name) {
    document.querySelectorAll('.tab').forEach(function(t) { t.style.display = 'none'; });
    document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById(name).style.display = 'block';
    document.getElementById('btn-' + name).classList.add('active');
}

(function() {
    var data = Router.currentData || {};
    var statsLevel = (data.team && data.team.stats_level) || 'basic';

    if (data.user) {
        document.getElementById('user-name').textContent = data.user.first_name + ' ' + data.user.last_name;
    }
    if (data.team) {
        document.getElementById('team-info').innerHTML = '<div class="team-name">' + escapeHtml(data.team.name) + '</div>';
    } else {
        document.getElementById('team-info').innerHTML = '<p style="color:#666;">Вы не состоите в команде</p>';
    }

    // События
    var eventsList = document.getElementById('events-list');
    if (data.events && data.events.length > 0) {
        eventsList.innerHTML = data.events.map(function(e) {
            var isMatch = e.event_type === 'match';
            return '<div class="event event-clickable" data-event-id="' + parseInt(e.id) + '" data-event-type="' + escapeHtml(e.event_type) + '">' +
                '<span class="event-arrow">›</span>' +
                '<div class="event-title">' + (isMatch ? '⚽' : '🏃') + ' ' + escapeHtml(e.title) + '</div>' +
                '<div class="event-date">' + escapeHtml(e.event_date) + '</div>' +
                (e.location ? '<div class="event-location">📍 ' + escapeHtml(e.location) + '</div>' : '') +
                (isMatch && e.has_stats ? '<div style="font-size:12px;color:#4caf50;margin-top:4px;">✓ Статистика внесена</div>' : '') +
                '</div>';
        }).join('');
        document.querySelectorAll('.event-clickable').forEach(function(el) {
            el.onclick = function() {
                var eventId = parseInt(this.getAttribute('data-event-id'));
                var eventType = this.getAttribute('data-event-type');
                Router.navigate('/event-detail', { event_id: eventId });
            };
        });
    } else {
        eventsList.innerHTML = '<p class="empty-state">Пока нет запланированных событий</p>';
    }

    // Статистика (только числа — экранирование не критично, но для единообразия)
    var stats = data.stats || { games: 0, goals: 0, assists: 0, yellow_cards: 0, red_cards: 0, pass_accuracy: 0 };
    var position = data.position || 'forward';

    if (position === 'goalkeeper') {
        document.getElementById('stats-grid').innerHTML =
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.games) + '</div><div class="stat-label">Матчей</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.saves || 0) + '</div><div class="stat-label">Сейвов</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.goals_conceded || 0) + '</div><div class="stat-label">Пропущено</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.save_pct || 0) + '%</div><div class="stat-label">% сейвов</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.yellow_cards) + '</div><div class="stat-label">ЖК</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.red_cards) + '</div><div class="stat-label">КК</div></div>';
    } else {
        document.getElementById('stats-grid').innerHTML =
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.games) + '</div><div class="stat-label">Матчей</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.goals) + '</div><div class="stat-label">Голов</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.assists) + '</div><div class="stat-label">Передач</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.yellow_cards) + '</div><div class="stat-label">ЖК</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + parseInt(stats.red_cards) + '</div><div class="stat-label">КК</div></div>' +
            (statsLevel === 'detailed' ? '<div class="stat-card"><div class="stat-value">' + parseInt(stats.pass_accuracy) + '%</div><div class="stat-label">Точность</div></div>' : '');
    }

    // Советы (тексты приходят из app.py, не от пользователей — безопасно, но для единообразия экранируем)
    var adviceEl = document.getElementById('advice-content');
    if (statsLevel !== 'detailed') {
        adviceEl.innerHTML =
            '<div style="text-align:center;padding:30px 20px;">' +
            '<div style="font-size:48px;margin-bottom:12px;">💎</div>' +
            '<div style="font-size:16px;font-weight:700;color:#333;margin-bottom:8px;">Советы доступны в детальном тарифе</div>' +
            '<div style="font-size:14px;color:#666;">Попроси тренера подключить детальный тариф чтобы получать персональные рекомендации по улучшению игры</div>' +
            '</div>';
    } else if (stats.games === 0) {
        adviceEl.innerHTML =
            '<div style="text-align:center;padding:30px 20px;">' +
            '<div style="font-size:48px;margin-bottom:12px;">📊</div>' +
            '<div style="font-size:16px;font-weight:700;color:#333;margin-bottom:8px;">Статистика пуста</div>' +
            '<div style="font-size:14px;color:#666;">Тренер ещё не внёс твои результаты. Советы появятся после первого матча.</div>' +
            '</div>';
    } else if (data.advice && data.advice.length > 0) {
        adviceEl.innerHTML = data.advice.map(function(a) {
            return '<div class="advice" style="margin-bottom:12px;">' +
                '<div class="advice-title">' + escapeHtml(a.icon) + ' ' + escapeHtml(a.title) + '</div>' +
                '<div class="advice-text">' + escapeHtml(a.text) + '</div>' +
                '</div>';
        }).join('');
    } else {
        adviceEl.innerHTML = '<div class="advice"><div class="advice-title">✅ Всё отлично!</div>' +
            '<div class="advice-text">По твоей статистике замечаний нет. Продолжай в том же духе!</div></div>';
    }

    // Меню
    var menuBtn = document.getElementById('menu-btn');
    var dropdownMenu = document.getElementById('dropdown-menu');
    menuBtn.onclick = function(e) { e.stopPropagation(); dropdownMenu.classList.toggle('open'); };
    document.addEventListener('click', function() { dropdownMenu.classList.remove('open'); });

    document.getElementById('rules-item').onclick = function() {
        Router.navigate('/rules', { back_route: '/dashboard' });
    };
    document.getElementById('switch-team-item').onclick = async function() {
        await API.leaveTeam(); Router.navigate('/select-team');
    };
    document.getElementById('quit-team-item').onclick = async function() {
        if (!confirm('Вы уверены, что хотите покинуть команду?')) return;
        var result = await API.quitTeam();
        if (result.success) Router.navigate('/select-team');
        else alert('Ошибка: ' + (result.error || 'неизвестная ошибка'));
    };
})();
</script>
