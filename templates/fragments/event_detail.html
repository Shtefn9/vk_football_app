<style>
.player-row { display:flex; justify-content:space-between; align-items:center; padding:14px 15px; border:1px solid #e5ebf1; border-radius:10px; margin-bottom:8px; cursor:pointer; transition:border-color 0.2s; }
.player-row:hover { border-color:#667eea; }
.player-row-name { font-weight:600; color:#333; }
.player-row-right { text-align:right; }
.player-position { font-size:12px; color:#888; }
.has-stats { color:#4caf50; font-size:13px; }
.no-stats { color:#bbb; font-size:13px; }
.back-btn-top { background:none; border:none; color:#667eea; font-size:15px; cursor:pointer; padding:0; margin-bottom:15px; display:block; }
</style>

<div class="container">
    <button class="back-btn-top" id="back-btn">← Назад</button>
    <div id="event-header" style="margin-bottom:20px;"></div>
    <h2>👥 Статистика игроков</h2>
    <p style="color:#666;font-size:14px;margin-bottom:15px;">Нажмите на игрока, чтобы внести статистику</p>
    <div id="players-list"></div>
</div>

<script>
(function() {
    var data = Router.currentData || {};

    if (data.event) {
        document.getElementById('event-header').innerHTML =
            '<div style="background:#f8f9ff;border-radius:12px;padding:15px;">' +
            '<div style="font-size:18px;font-weight:700;color:#333;">' + (data.event.event_type === 'match' ? '⚽' : '🏃') + ' ' + escapeHtml(data.event.title) + '</div>' +
            '<div style="color:#667eea;font-size:14px;margin-top:4px;">' + escapeHtml(data.event.event_date) + '</div>' +
            (data.event.location ? '<div style="color:#888;font-size:13px;">📍 ' + escapeHtml(data.event.location) + '</div>' : '') +
            '</div>';
    }

    var playersList = document.getElementById('players-list');
    if (data.players && data.players.length > 0) {
        playersList.innerHTML = data.players.map(function(p) {
            return '<div class="player-row" data-player-id="' + parseInt(p.id) + '" data-position="' + escapeHtml(p.position) + '">' +
                '<div>' +
                '<div class="player-row-name">' + escapeHtml(p.first_name) + ' ' + escapeHtml(p.last_name) + '</div>' +
                '<div class="player-position">' + escapeHtml(p.position_label) + '</div>' +
                '</div>' +
                '<div class="player-row-right">' +
                '<div class="' + (p.has_stats ? 'has-stats' : 'no-stats') + '">' + (p.has_stats ? '✓ Заполнено' : '— Нет данных') + '</div>' +
                '</div>' +
                '</div>';
        }).join('');

        document.querySelectorAll('.player-row').forEach(function(row) {
            row.onclick = function() {
                var playerId = parseInt(this.getAttribute('data-player-id'));
                // Имя игрока берём из data.players, а не из DOM-атрибута
                var player = data.players.find(function(p) { return p.id === playerId; });
                Router.navigate('/edit-stats', {
                    event_id: data.event.id,
                    player_id: playerId,
                    player_name: player ? (player.first_name + ' ' + player.last_name) : '',
                    position: this.getAttribute('data-position'),
                    stats_level: data.stats_level
                });
            };
        });
    } else {
        playersList.innerHTML = '<p class="empty-state">В команде пока нет игроков.</p>';
    }

    document.getElementById('back-btn').onclick = function() { Router.navigate('/dashboard'); };
})();
</script>
